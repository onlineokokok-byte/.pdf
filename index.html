<style>

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}

.menu{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));z-index:40;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:6px;min-width:210px}

#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--bg:#f1ebe4;--soft:#ffe1d1;--bd:#ddd4c9;--mu:#665f58;--acd:#b8400f;--pg:#e3dbd0;--sh:0 8px 26px rgba(70,35,10,.16)}
@media(prefers-color-scheme:dark){:root{--bg:#141211;--soft:#3d2a1e;--bd:#3d3731;--mu:#b0a89f;--acd:#ff9a6b;--pg:#0d0c0b;--sh:0 8px 26px rgba(0,0,0,.6)}}
#home{padding-top:0}
.hd{margin:0 -16px 20px;padding:max(26px,calc(env(safe-area-inset-top) + 14px)) 22px 26px 44px;background:var(--ac);color:#fff;border-radius:0 0 30px 30px;box-shadow:var(--sh);align-items:flex-end}
.logo{font-size:38px;line-height:1}.logo i{color:#26221f}
.hd small{display:block;margin-top:8px;opacity:.95;font-size:14px}
#inst{background:#fff;color:var(--acd);border:0}
.drop{background:var(--card);box-shadow:var(--sh)}

#mg{background:#26221f;color:#fff;border-color:#26221f}
.acts label.btn{background:var(--soft);color:var(--acd);border-color:transparent}

.logo{font-size:56px;font-weight:900;letter-spacing:-3px;line-height:.95;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.logo i{margin-right:2px}

<div id="home" class="wrap">
 <div class="hd"><div><div class="logo"><i>.</i>pdf</div></div><button id="inst" hidden>Install app</button></div>
 <label class="drop"><input id="up" type="file" accept="application/pdf" multiple hidden><span data-i="ul" data-s="30"></span><b>Upload a PDF</b><small>Tap to choose, or drop files here. Up to 20 MB each.</small></label>
 <div class="acts"><button id="mg" disabled data-i="mg"><span id="mgn">Merge files</span></button><label class="btn" data-i="im"><input id="im" type="file" accept="image/*" multiple hidden><span>Images to PDF</span></label></div>
 <div class="seg"><button data-tab="recent" class="on">Recent</button><button data-tab="all">All (<span id="cnt">0</span>)</button></div>
 <input id="q" type="search" placeholder="Search your files">
 <div id="list"></div>
</div>
<div id="ed" hidden>
 <div class="top"><button id="bk" class="ib" data-i="bk" aria-label="Back"></button><h2 id="ttl"></h2>
  <button id="un" class="ib" data-i="un" aria-label="Undo"></button><button id="re" class="ib" data-i="re" aria-label="Redo"></button>

  <button data-m="dl" data-i="dl">Download PDF</button><button data-m="copy" data-i="fl">Save a copy</button><button data-m="split" data-i="mg">Extract pages</button><button data-m="img" data-i="im">Save pages as images</button><button data-m="txt" data-i="tx">Save text as .txt</button></div>
 <div id="pages"></div>
 <div id="ctx" class="ctx" hidden><div id="sws"></div><div id="sz"><button data-k="-" aria-label="Smaller">A−</button><button data-k="+" aria-label="Larger">A+</button></div><button id="del" data-i="tr" aria-label="Delete"></button></div>
 <div class="dock"><button data-t="select" data-i="cu" class="on"><span>Select</span></button><button data-t="edit" data-i="ed"><span>Edit</span></button><button data-t="text" data-i="tx"><span>Add text</span></button><button data-t="hl" data-i="hl"><span>Highlight</span></button><button data-t="pen" data-i="pn"><span>Draw</span></button><button data-t="img" data-i="im"><span>Image</span></button></div>
 <input id="pi" type="file" accept="image/png,image/jpeg" hidden>
</div>
<dialog id="dlg"><h3 id="dt"></h3><input id="di"><div id="db"></div></dialog>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],MAX=20*1048576;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const {PDFDocument,StandardFonts,rgb,degrees,LineCapStyle}=PDFLib;
const P={dl:'<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/>',ul:'<path d="M12 16V5m0 0L8 9m4-4l4 4M5 19h14"/>',tr:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',bk:'<path d="M15 5l-7 7 7 7"/>',un:'<path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/>',re:'<path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3"/>',tx:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',hl:'<path d="M4 20h6M14 5l5 5-8 8H7v-4z"/>',pn:'<path d="M3 17c3-6 5 4 8-2s5-8 10-6"/>',im:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/>',cu:'<path d="M5 3l14 8-6 2-2 6z"/>',ro:'<path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/>',up:'<path d="M6 14l6-6 6 6"/>',dn:'<path d="M6 10l6 6 6-6"/>',mo:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',fl:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>',ed:'<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',mg:'<path d="M6 4v5a6 6 0 006 6 6 6 0 006-6V4M12 15v5"/>'};
const I=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
$$('[data-i]').forEach(b=>b.insertAdjacentHTML('afterbegin',I(b.dataset.i,+b.dataset.s||20)));
const db=new Promise((ok,no)=>{const r=indexedDB.open('pps',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const q=f(d.transaction('f',m).objectStore('f'));q.onsuccess=()=>ok(q.result);q.onerror=no})};
const all=()=>tx('readonly',s=>s.getAll()),put=r=>tx('readwrite',s=>s.put(r)),del=id=>tx('readwrite',s=>s.delete(id));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';
const ago=t=>{const m=(Date.now()-t)/6e4;return m<1?'Just now':m<60?Math.floor(m)+' min ago':m<1440?Math.floor(m/60)+' h ago':new Date(t).toLocaleDateString()};
const buf=b=>b.arrayBuffer(),wait=ms=>new Promise(r=>setTimeout(r,ms)),hex=h=>rgb(...h.slice(1).match(/../g).map(x=>parseInt(x,16)/255));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)};
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)};
function ask(title,o={}){return new Promise(res=>{const d=$('#dlg'),i=$('#di'),btns=o.btns||['Cancel','OK'],last=btns.length-1;
 $('#dt').textContent=title;i.hidden=!o.input;i.value='';i.placeholder=o.ph||'';
 $('#db').innerHTML=btns.map((b,k)=>`<button data-k="${k}" ${k==last?'class="pri"':''}>${b}</button>`).join('');
 const fin=v=>{d.onclick=d.oncancel=i.onkeydown=null;if(d.open)d.close();res(v)};
 d.onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=+b.dataset.k;fin(o.input?(k==last?i.value.trim():null):k)};
 d.oncancel=e=>{e.preventDefault();fin(o.input?null:-1)};i.onkeydown=e=>{if(e.key=='Enter')fin(i.value.trim())};
 d.showModal();if(o.input)i.focus()})}

/* ---------- Library ---------- */
let files=[],tab='recent',pick=new Set(),cur,bytes;
async function thumb(b){try{const pg=await(await pdfjsLib.getDocument({data:b.slice()}).promise).getPage(1),s=160/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:s}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c.toDataURL('image/jpeg',.7)}catch{return''}}
async function add(b,name){const blob=new Blob([b],{type:'application/pdf'});await put({id:crypto.randomUUID(),name,size:blob.size,date:Date.now(),blob,thumb:await thumb(b)});await load()}
async function load(){files=(await all()).sort((a,b)=>b.date-a.date);render()}
function render(){
 const q=$('#q').value.trim().toLowerCase();let l=files.filter(f=>f.name.toLowerCase().includes(q));if(tab=='recent'&&!q)l=l.slice(0,5);
 $('#list').innerHTML=l.length?l.map(f=>`<div class="card"><input type="checkbox" data-s="${f.id}" ${pick.has(f.id)?'checked':''} aria-label="Select ${esc(f.name)}">${f.thumb?`<img class="th" src="${f.thumb}" alt="">`:`<div class="th">${I('fl')}</div>`}<div class="nm" data-o="${f.id}" tabindex="0" role="button"><b>${esc(f.name)}</b><small>${fmt(f.size)} · ${ago(f.date)}</small></div><button class="ib" data-d="${f.id}" aria-label="Download">${I('dl')}</button><button class="ib" data-x="${f.id}" aria-label="Delete">${I('tr')}</button></div>`).join(''):`<div class="empty">${q?'No files match your search.':'Your PDFs will show up here. Upload one to get started.'}</div>`;
 $('#cnt').textContent=files.length;$('#mg').disabled=pick.size<2;$('#mgn').textContent=pick.size>1?`Merge ${pick.size} files`:'Merge files'}
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('on',x==b));render()});
$('#q').oninput=render;
async function addFiles(list){for(const f of list){if(!/pdf$/i.test(f.type||f.name)){toast(f.name+' is not a PDF');continue}if(f.size>MAX){toast(f.name+' is over the 20 MB limit');continue}
 try{const b=await buf(f);await PDFDocument.load(b);await add(b,f.name)}catch{toast(f.name+' could not be opened. It may be damaged or password protected.')}}}
$('#up').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};
const dz=$('.drop');['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over');if(v=='drop')addFiles(e.dataTransfer.files)}));
const openRow=id=>openFile(files.find(f=>f.id==id));
$('#list').onclick=async e=>{const t=e.target;if(t.dataset.s){t.checked?pick.add(t.dataset.s):pick.delete(t.dataset.s);render();return}
 const g=a=>t.closest('['+a+']')?.getAttribute(a),o=g('data-o'),d=g('data-d'),x=g('data-x');
 if(o)openRow(o);if(d){const f=files.find(f=>f.id==d);dl(f.blob,f.name)}
 if(x&&await ask('Delete this file?',{btns:['Cancel','Delete']})==1){await del(x);pick.delete(x);load()}};
$('#list').onkeydown=e=>{if(e.key=='Enter'&&e.target.dataset.o)openRow(e.target.dataset.o)};
$('#mg').onclick=async()=>{const out=await PDFDocument.create();for(const id of pick){const f=files.find(f=>f.id==id),s=await PDFDocument.load(await buf(f.blob));(await out.copyPages(s,s.getPageIndices())).forEach(p=>out.addPage(p))}pick.clear();await add(await out.save(),'merged.pdf');toast('Created merged.pdf')};
$('#im').onchange=async e=>{const out=await PDFDocument.create();for(const f of e.target.files){try{const c=await createImageBitmap(f),cv=document.createElement('canvas');cv.width=c.width;cv.height=c.height;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(c,0,0);const j=await out.embedJpg(await buf(await new Promise(r=>cv.toBlob(r,'image/jpeg',.92))));out.addPage([c.width,c.height]).drawImage(j,{x:0,y:0,width:c.width,height:c.height})}catch{toast(f.name+' is not a supported image')}}if(out.getPageCount()){await add(await out.save(),'images.pdf');toast('Created images.pdf')}e.target.value=''};
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});

 if(m=='img'){toast('Saving pages. Allow multiple downloads if asked.');const p=await getDoc();for(let i=1;i<=p.numPages;i++){const pg=await p.getPage(i),v=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;dl(await new Promise(r=>c.toBlob(r)),`${base()}-page${i}.png`);await wait(400)}}
 if(m=='txt'){const p=await getDoc();let t='';for(let i=1;i<=p.numPages;i++){const c=await(await p.getPage(i)).getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?'\n':'')).join('')+'\n\n'}
  if(!t.trim())return toast('No text found. This PDF may be a scanned image.');dl(new Blob([t],{type:'text/plain'}),base()+'.txt')}};
load();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
